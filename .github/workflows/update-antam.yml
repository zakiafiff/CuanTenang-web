name: Perbarui Harga Antam

on:
  schedule:
    # 02:00 UTC = 09:00 WIB, setelah harga Antam hari itu biasanya sudah terbit
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambil harga Antam terbaru
        env:
          EMAS_API_KEY: ${{ secrets.EMAS_API_KEY }}
        run: python3 scripts/update_antam.py

      - name: Commit perubahan (kalau ada)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/antam-data.js data/antam-history.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan harga hari ini."
          else
            git commit -m "Perbarui harga Antam $(date -u +%Y-%m-%d)"
            git push
          fi
